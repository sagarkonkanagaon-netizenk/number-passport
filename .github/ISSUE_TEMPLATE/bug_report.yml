name: Bug report
description: Something gave a wrong number, crashed, or behaved differently from the docs.
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste customer data, credentials or connection strings.**
        For a security problem, use [private reporting](https://github.com/sagarkonkanagaon-netizenk/number-passport/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Ideally a change to `examples/bank` that shows the problem.
      placeholder: |
        1. python examples/bank/build.py
        2. edit models/sql/silver_exposures.sql ...
        3. passport trace total_rwa
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `passport doctor`
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `passport --version`
    validations:
      required: true
  - type: dropdown
    id: warehouse
    attributes:
      label: Warehouse
      options: [DuckDB, CSV / Parquet files, PostgreSQL, Snowflake, Databricks, BigQuery, Other SQLAlchemy]
    validations:
      required: true
  - type: dropdown
    id: code
    attributes:
      label: Pipeline code involved
      multiple: true
      options: [SQL, dbt, PySpark, Airflow]
  - type: input
    id: python
    attributes:
      label: Python version and OS
